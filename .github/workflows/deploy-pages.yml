name: GitHub Pagesへ公開

on:
  push:
    branches:
      - claude/x-auto-reply-playwright-9zv2zs
    paths:
      - "site/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pagesを設定
        uses: actions/configure-pages@v5

      - name: siteディレクトリをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: GitHub Pagesへデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
