<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品一覧</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="age-gate" id="age-gate">
    <div class="age-gate-box">
      <p class="age-gate-title">年齢確認</p>
      <p class="age-gate-text">このサイトはアダルトコンテンツを含みます。<br>あなたは18歳以上ですか？</p>
      <div class="age-gate-buttons">
        <button type="button" id="age-gate-yes" class="age-gate-btn age-gate-btn--yes">はい（18歳以上）</button>
        <a href="https://www.google.com" class="age-gate-btn age-gate-btn--no">いいえ</a>
      </div>
    </div>
  </div>

  <div class="page">
    <div class="filter-bar">
      <div class="genre-select-group">
        <label for="genre-select" class="genre-select-label">📂 ジャンル:</label>
        <select id="genre-select">
          <option value="ALL">✨ すべて表示 (ALL)</option>
          <option value="電子書籍">📖 電子書籍</option>
          <option value="アダルト写真集">📸 アダルト写真集</option>
          <option value="DL動画">🎬 DL動画</option>
          <option value="DVD">💿 DVD</option>
        </select>
      </div>

      <div class="sort-buttons" role="group" aria-label="並べ替え">
        <button type="button" class="sort-btn sort-btn--recommend is-active" data-sort="recommend">🔥 おすすめ順</button>
        <button type="button" class="sort-btn sort-btn--popular" data-sort="popular">👀 人気順</button>
      </div>
    </div>

    <div class="result-count" id="result-count"></div>

    <!-- ここにGoogle広告のクリック報酬型タグ(AdSense等の管理画面で発行されたコード)をそのまま貼る -->
    <div class="ad-slot" id="ad-slot-top"></div>

    <main class="product-list" id="product-list"></main>
  </div>

  <script src="app.js"></script>
</body>
</html>
