<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品一覧</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <div class="sort-bar">
      <span class="sort-bar-label">並び替え:</span>
      <div class="sort-buttons" role="group" aria-label="並べ替え">
        <button type="button" class="sort-btn sort-btn--recommend is-active" data-sort="recommend">🔥 おすすめ順（売れ筋）</button>
        <button type="button" class="sort-btn sort-btn--popular" data-sort="popular">👀 人気順（PV数）</button>
      </div>
    </div>

    <!-- ここにGoogle広告のクリック報酬型タグ(AdSense等の管理画面で発行されたコード)をそのまま貼る -->
    <div class="ad-slot" id="ad-slot-top"></div>

    <main class="product-list" id="product-list"></main>
  </div>

  <script src="app.js"></script>
</body>
</html>
