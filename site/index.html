<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="ED.notは電子書籍・写真集・動画などの作品を人気順・おすすめ順で探せる作品一覧サイトです。ジャンル絞り込みやお気に入り機能で、気になる作品を見つけやすくしています。">
<meta name="google-site-verification" content="Kwb_6CfEL1U7C_MGwhdvadpLxHfEfVgldwScgNRhSFQ" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23111827'/%3E%3Ctext x='50' y='70' font-family='Arial, sans-serif' font-size='58' font-weight='900' fill='%23ffffff' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<meta property="og:site_name" content="ED.not">
<meta property="og:title" content="ED.not | 作品一覧">
<meta property="og:description" content="ED.notは電子書籍・写真集・動画などの作品を人気順・おすすめ順で探せる作品一覧サイトです。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://adoafi903.github.io/adoafi908/index.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:site" content="@hitorigoto309">
<title>ED.not | 作品一覧</title>
<link rel="stylesheet" href="style.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1762537531453495" crossorigin="anonymous"></script>
</head>
<body>
  <div class="age-gate" id="age-gate">
    <div class="age-gate-box">
      <p class="age-gate-title">年齢確認</p>
      <p class="age-gate-text">このサイトはアダルトコンテンツを含みます。<br>あなたは18歳以上ですか？</p>
      <div class="age-gate-buttons">
        <button type="button" id="age-gate-yes" class="age-gate-btn age-gate-btn--yes">はい（18歳以上）</button>
        <a href="https://www.google.com" class="age-gate-btn age-gate-btn--no">いいえ</a>
      </div>
    </div>
  </div>

  <div class="page">
    <nav class="site-nav">
      <div class="site-brand-group">
        <a href="index.html" class="site-brand">ED.not</a>
        <a href="https://x.com/hitorigoto309" class="site-social" target="_blank" rel="noopener noreferrer" aria-label="X（旧Twitter）">𝕏</a>
      </div>
      <div class="site-nav-links">
        <a href="index.html" class="is-active">📚 作品一覧</a>
        <a href="column.html?category=コラム">📝 コラム</a>
        <a href="column.html?category=出会い">💌 出会い</a>
      </div>
    </nav>

    <section class="ranking-banner" aria-label="売れ筋ランキング（パッケージ画像）">
      <div class="ranking-banner-track" id="ranking-banner-track"></div>
    </section>

    <div class="filter-bar">
      <div class="genre-select-group">
        <label for="genre-select" class="genre-select-label">📂 ジャンル:</label>
        <select id="genre-select">
          <option value="ALL">✨ すべて表示 (ALL)</option>
          <option value="電子書籍">📖 電子書籍</option>
          <option value="アダルト写真集">📸 アダルト写真集</option>
          <option value="DL動画">🎬 DL動画</option>
          <option value="DVD">💿 DVD</option>
        </select>
      </div>

      <div class="sort-buttons" role="group" aria-label="並べ替え">
        <button type="button" class="sort-btn sort-btn--recommend is-active" data-sort="recommend">🔥 おすすめ順</button>
        <button type="button" class="sort-btn sort-btn--popular" data-sort="popular">👀 人気順</button>
      </div>
    </div>

    <div class="result-count" id="result-count"></div>

    <!-- ここにGoogle広告のクリック報酬型タグ(AdSense等の管理画面で発行されたコード)をそのまま貼る -->
    <div class="ad-slot" id="ad-slot-top"></div>

    <main class="product-list" id="product-list"></main>

    <footer class="site-footer">
      <p class="site-footer-disclosure">当サイトはアフィリエイト広告を利用しています。掲載している商品・サービスの購入によって、当サイトに紹介料が支払われる場合があります。</p>
      <nav class="site-footer-nav">
        <a href="index.html">作品一覧</a>
        <a href="column.html">コラム</a>
        <a href="column.html?category=出会い">出会い</a>
        <a href="privacy.html">プライバシーポリシー</a>
      </nav>
      <p class="site-footer-copyright">© 2026 ED.not</p>
    </footer>
  </div>

  <button type="button" class="favorites-fab" id="favorites-fab">
    ⭐ お気に入り <span class="favorites-fab-count" id="favorites-fab-count">0</span>
  </button>

  <div class="favorites-modal" id="favorites-modal" hidden>
    <div class="favorites-modal-box">
      <div class="favorites-modal-header">
        <p class="favorites-modal-title">⭐ お気に入りリスト</p>
        <button type="button" class="favorites-modal-close" id="favorites-modal-close">✕</button>
      </div>
      <div class="favorites-modal-body" id="favorites-modal-body"></div>
      <div class="favorites-modal-footer">
        <button type="button" class="bulk-buy-btn" id="bulk-buy-btn">選択した作品をまとめて購入する</button>
        <p class="bulk-buy-note">※チェックした作品それぞれの外部販売サイトが新しいタブで開きます（合算決済ではありません）</p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
